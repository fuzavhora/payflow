name: PayFlow CI

on:
  push:
    branches:
      - main
      - feat/payflow-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, unit, integration and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_local
          POSTGRES_DB: payflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payflow:payflow_local@localhost:5432/payflow_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build applications
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare isolated PostgreSQL test schema
        run: pnpm --filter @payflow/api prisma:test:reset

      - name: API integration tests
        run: pnpm --filter @payflow/api test:integration
