name: PayFlow CI

on:
  push:
    branches:
      - main
      - feat/payflow-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://payflow:payflow_local@localhost:5432/payflow?schema=public

      - name: Build applications
        run: pnpm build
        env:
          DATABASE_URL: postgresql://payflow:payflow_local@localhost:5432/payflow?schema=public

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
